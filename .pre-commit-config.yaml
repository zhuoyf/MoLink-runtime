repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Python lint
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Python format
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: shell-syntax
        name: Shell syntax
        entry: bash -n
        language: system
        types: [shell]
